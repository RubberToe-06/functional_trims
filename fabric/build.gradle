plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin'
}

// e.g. 2.2.1+26.2 -> functional_trims-fabric-2.2.1+26.2.jar
version = "${project.mod_version}+${project.minecraft_version}"

base {
    archivesName = "${project.archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

java {
    withSourcesJar()
}

// "common" (shared code for both loaders) is a plain source directory, not a Gradle
// subproject - see the note in settings.gradle for why.
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
        resources {
            srcDir rootProject.file('common/src/main/resources')
            srcDir rootProject.file('common/src/main/generated')
        }
    }
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

loom {
    runs {
        datagen {
            inherit client
            name "Fabric Data Generation"

            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${rootProject.file("common/src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${project.mod_id}"

            runDir "build/datagen"
        }
    }
}

apply from: rootProject.file('gradle/publishing.gradle')

publishMods {
    file = jar.archiveFile
    changelog = releaseNotes
    displayName = "${project.mod_version} for ${project.minecraft_version} (Fabric)"
    modLoaders.add('fabric')

    def modVersion = project.mod_version as String
    type = modVersion.contains('alpha') ? ALPHA : (modVersion.contains('beta') || modVersion.contains('rc')) ? BETA : STABLE

    dryRun = publishDryRun

    def gameVersions = (project.publish_minecraft_versions as String).split(',')*.trim()

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = project.modrinth_id
        // Loader suffix keeps the Fabric and NeoForge entries distinct on Modrinth
        version = "${project.version}-fabric"
        minecraftVersions.addAll(gameVersions)
        requires('fabric-api')
        optional('cloth-config')
        optional('modmenu')
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = project.curseforge_id
        minecraftVersions.addAll(gameVersions)
        client = true
        server = true
        requires('fabric-api')
        optional('cloth-config')
        optional('modmenu')
    }

    github {
        // The GitHub release is shared with NeoForge (its publishGithub parents onto this
        // task), so its title shouldn't call out one loader.
        displayName = "${project.mod_version} for ${project.minecraft_version}"
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = project.github_repo
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = providers.environmentVariable('GITHUB_REF_NAME').orElse("v${project.version}")
        additionalFiles.from(buildServerResourcePack.flatMap { it.archiveFile })
    }
}
