pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

// ModDevGradle's own tooling (asset downloads etc.) needs a JDK 21 toolchain regardless of
// the project's Java 25 target; let Gradle auto-provision one if the machine doesn't have it.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        maven { url = "https://maven.neoforged.net/releases/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }
}

rootProject.name = "functional_trims"

// "common" is not a Gradle subproject: Fabric Loom (1.17.0-alpha.19) cannot be applied to
// more than one project in the same build without corrupting its shared extension state
// (ClassCastException on LoomGradleExtensionImpl_Decorated, reproduced empirically).
// Instead, common/src is included as an extra source directory by both leaf modules below.
include("fabric", "neoforge")
