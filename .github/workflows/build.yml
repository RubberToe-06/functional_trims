# Builds the mod on every push to a maintained branch and on every pull request.
# Only `main` is actively developed; `legacy/*` branches are frozen snapshots of
# older Minecraft versions and are still built so community backports get CI.

name: build

on:
  push:
    branches: [main, master, 'legacy/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check generated data is committed
        run: |
          if [ ! -d src/main/generated ]; then
            echo "::error::src/main/generated is missing. Run ./gradlew runDatagen locally and commit the output."
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Read version
        id: meta
        run: echo "version=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.meta.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
