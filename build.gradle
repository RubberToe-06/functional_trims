plugins {
    // Declared once here so both loader modules share one plugin classloader, which lets the
    // NeoForge GitHub publish reuse the release created by the Fabric one (see neoforge/build.gradle).
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}" apply false
}

allprojects {
    group = project.maven_group
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    repositories {
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
    }
}
