plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}"
}

import groovy.json.JsonOutput
import java.security.MessageDigest

group = project.maven_group
// e.g. 2.2.1+26.2 -> functional_trims-2.2.1+26.2.jar
version = "${project.mod_version}+${project.minecraft_version}"

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

loom {
    runs {
        datagen {
            inherit client
            name "Fabric Data Generation"

            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${project.mod_id}"

            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

def serverResourcePackStagingDir = layout.buildDirectory.dir("resourcepack/staging")

tasks.register('prepareServerResourcePack') {
    doLast {
        def stagingDir = serverResourcePackStagingDir.get().asFile
        def assetsSource = file('src/main/resources/assets/functional_trims')
        def assetsTarget = new File(stagingDir, 'assets/functional_trims')

        delete(stagingDir)

        copy {
            from(assetsSource)
            into(assetsTarget)
        }

        def packMeta = [
                pack: [
                        pack_format: project.resource_pack_format as int,
                        description: "Functional Trims client assets for dedicated servers"
                ]
        ]
        new File(stagingDir, 'pack.mcmeta').text = JsonOutput.prettyPrint(JsonOutput.toJson(packMeta)) + System.lineSeparator()

        def modIcon = file('src/main/resources/assets/functional_trims/icon.png')
        if (modIcon.exists()) {
            copy {
                from(modIcon)
                into(stagingDir)
                rename { 'pack.png' }
            }
        }
    }
}

def buildServerResourcePack = tasks.register('buildServerResourcePack', Zip) {
    dependsOn(tasks.named('prepareServerResourcePack'))

    archiveBaseName.set('functional_trims_server_resource_pack')
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('resourcepacks'))

    from(serverResourcePackStagingDir)
}

tasks.register('writeServerResourcePackSha1') {
    dependsOn(buildServerResourcePack)

    doLast {
        def zipFile = buildServerResourcePack.get().archiveFile.get().asFile
        def digest = MessageDigest.getInstance('SHA-1').digest(zipFile.bytes)
        def sha1 = digest.collect { String.format('%02x', it) }.join()
        def outFile = new File(zipFile.parentFile, zipFile.name + '.sha1')
        outFile.text = sha1 + System.lineSeparator()
        println("Wrote SHA1: ${outFile}")
    }
}

// ---------------------------------------------------------------------------
// Publishing (Modrinth, CurseForge, GitHub Releases)
// Run by .github/workflows/publish.yml when a v<mod_version>+<minecraft_version>
// tag is pushed. Release notes come from the matching section of CHANGELOG.md.
// Without API tokens in the environment this is a dry run (files are written to
// build/publishMods instead of being uploaded).
// ---------------------------------------------------------------------------

def releaseNotes = providers.provider {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        throw new GradleException('CHANGELOG.md is missing')
    }
    def version = java.util.regex.Pattern.quote(project.mod_version as String)
    def matcher = (changelogFile.text =~ /(?ms)^## ${version}(?:[ \t][^\n]*)?\n(.*?)(?=^## |\z)/)
    if (!matcher.find() || matcher.group(1).trim().isEmpty()) {
        throw new GradleException("CHANGELOG.md has no '## ${project.mod_version}' section with release notes")
    }
    matcher.group(1).trim()
}

publishMods {
    file = jar.archiveFile
    changelog = releaseNotes
    displayName = "${project.mod_version} for ${project.minecraft_version}"
    modLoaders.add('fabric')

    def modVersion = project.mod_version as String
    type = modVersion.contains('alpha') ? ALPHA : (modVersion.contains('beta') || modVersion.contains('rc')) ? BETA : STABLE

    // Dry run unless explicitly enabled AND both platform tokens are present.
    dryRun = providers.provider {
        providers.environmentVariable('PUBLISH_DRY_RUN').getOrElse('false') == 'true' ||
                !providers.environmentVariable('MODRINTH_TOKEN').isPresent() ||
                !providers.environmentVariable('CURSEFORGE_API_KEY').isPresent()
    }

    def gameVersions = (project.publish_minecraft_versions as String).split(',')*.trim()

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = project.modrinth_id
        minecraftVersions.addAll(gameVersions)
        requires('fabric-api', 'cloth-config')
        optional('modmenu')
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = project.curseforge_id
        minecraftVersions.addAll(gameVersions)
        client = true
        server = true
        requires('fabric-api', 'cloth-config')
        optional('modmenu')
    }

    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = project.github_repo
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = providers.environmentVariable('GITHUB_REF_NAME').orElse("v${project.version}")
        additionalFiles.from(buildServerResourcePack.flatMap { it.archiveFile })
    }
}
